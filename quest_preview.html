<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Code Bug Drills</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memory">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FCFAF5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07102a;--glass:rgba(12,24,58,.62);--glass-line:rgba(120,170,255,.28);
  --ink:#eef3ff;--ink-2:#b4c3e6;--ink-3:#7f90b8;
  --glow:#3d8bff;--glow-2:#69b4ff;--gold:#ffc861;--ok:#5fe0a8;--bad:#ff8a80;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{position:relative;max-width:440px;overflow-x:hidden;height:100%;min-height:640px;margin:0 auto;overflow:hidden;background:var(--night)}
.bg{position:absolute;inset:0;background:url(app_assets/quest_bg.webp) center 72%/100% auto no-repeat,linear-gradient(180deg,var(--lb-09183a,#09183a) 0%,var(--lb-0b1b40,#0b1b40) 55%,var(--lb-0f2142,#0f2142) 100%);transition:filter .6s,transform 1.2s}
/* the full hero and temple always stay in the picture; the plain night sky above it fills the rest */
.app.soft .bg{filter:brightness(.62)}
.app.dim .bg{filter:blur(5px) brightness(.4);transform:scale(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,var(--lb-rgba5123435,rgba(5,12,34,.35)) 0%,var(--lb-rgba512340,rgba(5,12,34,0)) 22%,var(--lb-rgba512340,rgba(5,12,34,0)) 78%,var(--lb-rgba512347,rgba(5,12,34,.7)) 100%);pointer-events:none}
.view{position:absolute;inset:0;display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom))}
.view.on{display:flex;animation:in .5s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--lb-rgba1020505,rgba(10,20,50,.5));border:1px solid var(--glass-line);font-weight:700;font-size:17px;backdrop-filter:blur(8px)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--lb-rgba1020505,rgba(10,20,50,.5));border:1px solid var(--glass-line);backdrop-filter:blur(8px)}
.icon-btn svg{width:20px;height:20px}

/* title */
.brand{text-align:center;margin-top:18px}
.brand .mark{font:700 30px 'JetBrains Mono',monospace;color:var(--glow-2);text-shadow:0 0 18px rgba(80,150,255,.9)}
.brand h1{font-size:34px;font-weight:800;letter-spacing:-.01em;margin-top:6px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.brand p{color:var(--ink-2);font-size:16px;margin-top:6px;letter-spacing:.02em}

/* glowing button */
.go{margin-top:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:76px;padding:12px 24px;border-radius:999px;
  background:linear-gradient(180deg,#4f9bff 0%,#1f5fe0 100%);border:1.5px solid rgba(170,210,255,.85);
  box-shadow:0 0 28px rgba(61,139,255,.75),inset 0 1px 0 rgba(255,255,255,.35);animation:breathe 3.2s ease-in-out infinite}
.go b{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700}
.go b::before{content:"";border-left:16px solid var(--ld-e9f3ff,#e9f3ff);border-top:10px solid transparent;border-bottom:10px solid transparent}
.go span{font-size:14px;color:#cfe2ff;margin-top:2px}
.go:active{transform:scale(.98)}
@keyframes breathe{50%{box-shadow:0 0 40px rgba(61,139,255,.95),inset 0 1px 0 rgba(255,255,255,.35)}}
.go.plain b::before{display:none}

/* journey */
.j-head{text-align:center;margin-top:8px}
.j-head h2{font-size:30px;font-weight:800}
.flame{font-size:44px;line-height:1;margin-top:10px;filter:drop-shadow(0 0 16px rgba(255,170,60,.7))}
.streak{font-size:22px;font-weight:700;margin-top:6px}
.card{margin-top:18px;padding:14px 16px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);box-shadow:0 0 30px rgba(40,110,255,.18)}
.card h3{font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{font-size:14px;color:var(--ink-3);font-weight:500}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px 6px;margin-top:12px}
.wk i{font-style:normal;text-align:center;font-size:12px;color:var(--ink-3)}
.wk em{height:15px;border-radius:5px;background:var(--lb-rgba12015021012,rgba(120,150,210,.12))}
.wk em.done{background:linear-gradient(180deg,#6cc0ff,#2f86ff);box-shadow:0 0 10px rgba(70,150,255,.55)}
.wk em.today{background:transparent;border:2px solid var(--gold);box-shadow:0 0 10px rgba(255,200,97,.5)}
.wk em.blank{background:transparent}
.next{text-align:center;margin-top:22px;font-size:17px;color:var(--ink-2);font-style:italic}
.next b{color:var(--gold);font-style:normal}

/* drill */
.bar{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--lb-rgba1401702302,rgba(140,170,230,.2))}
.dots i.done{background:var(--ok)}
.dots i.cur{background:var(--glow-2);box-shadow:0 0 8px var(--glow)}
.ask{font-size:22px;font-weight:700;margin-top:26px;line-height:1.3}
.code{margin-top:16px;border-radius:16px;background:var(--lb-1e1e1e,#1e1e1e);border:1px solid var(--ld-333,#333);padding:10px 0;font:13px/1.75 "JetBrains Mono",monospace;overflow:hidden;font-variant-ligatures:none;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.code div{display:grid;grid-template-columns:auto 1fr;padding:0 12px 0 8px;color:var(--lc-d4d4d4,#d4d4d4);border-left:3px solid transparent;cursor:pointer;transition:background .2s}
.code .nb{white-space:pre}
.code div>span.t{white-space:pre-wrap;overflow-wrap:break-word;min-width:0}
.code div:hover{background:var(--lb-2a2d2e,#2a2d2e)}
.code div.bad{background:var(--lb-rgba25512011016,rgba(255,120,110,.16));border-left-color:var(--bad);animation:shake .35s}
.code div.hit{background:var(--lb-rgba9522416814,rgba(95,224,168,.14));border-left-color:var(--ok)}
.code u{text-decoration:none;color:var(--lc-858585,#858585);display:inline-block;width:2.2ch;margin-right:10px;text-align:right}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.k{color:var(--lc-c586c0,#c586c0)}.f{color:var(--lc-dcdcaa,#dcdcaa)}.n{color:var(--lc-b5cea8,#b5cea8)}.s{color:var(--lc-ce9178,#ce9178)}.c{color:var(--lc-6a9955,#6a9955)}.v{color:var(--lc-9cdcfe,#9cdcfe)}.b{color:var(--lc-4ec9b0,#4ec9b0)}
.fix{display:none;margin-top:14px}
.fix.on{display:block;animation:in .4s}
.fix input{width:100%;min-width:0;padding:14px;border-radius:14px;background:var(--lb-1e1e1e,#1e1e1e);border:1.5px solid var(--ld-3c3c3c,#3c3c3c);color:var(--lc-d4d4d4,#d4d4d4);font:15px 'JetBrains Mono',monospace;outline:none}
.fix input:focus{border-color:var(--glow)}
.say{min-height:24px;margin-top:12px;font-size:16px;color:var(--ink-2);line-height:1.5}
.say.ok{color:var(--ok)}.say.bad{color:var(--bad)}

/* end */
.win{margin-top:12vh;text-align:center}
.win .big{font-size:72px;font-weight:800;text-shadow:0 0 30px rgba(80,150,255,.8)}
.win p{font-size:18px;color:var(--ink-2);margin-top:8px}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);pointer-events:none;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}
.chips{display:flex;gap:8px}
.stats{display:flex;justify-content:center;gap:14px;margin-top:16px}
.stats>div{display:flex;flex-direction:column;align-items:center;min-width:120px;padding:12px 10px;border-radius:18px;background:var(--lb-rgba10205045,rgba(10,20,50,.45));border:1px solid var(--glass-line);backdrop-filter:blur(8px)}
.stats .ico{font-size:30px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,170,60,.55))}
.stats b{font-size:28px;font-weight:800;margin-top:6px}
.stats small{font-size:13px;color:var(--ink-2)}
.wk em.more{background:linear-gradient(180deg,#bfe6ff,#4aa3ff);box-shadow:0 0 14px rgba(120,190,255,.95),0 0 4px #fff inset}
.wk em.today.done,.wk em.today.more{border:2px solid var(--gold)}
.key{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-3)}
.key i{display:inline-block;width:14px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gain{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 18px;border-radius:999px;background:var(--lb-rgba1020505,rgba(10,20,50,.5));border:1px solid var(--glass-line)}
.gain .ico{font-size:22px}.gain b{font-size:24px;font-weight:800}
.gain.pop{animation:gainPop .6s ease-out}
@keyframes gainPop{40%{transform:scale(1.15);box-shadow:0 0 30px rgba(255,200,97,.7)}}
.chip.bump{animation:gainPop .6s ease-out}
/* small phones: slightly smaller code, so every drill line fits without a sideways scroll */
@media (max-width:359px){.chip{padding:7px 10px;font-size:15px}.stats>div{min-width:0;flex:1}.code{font-size:11.5px}.code u{margin-right:7px}.view{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bg"></div><div class="shade"></div>

  <!-- home: the title, the streak and one button -->
  <section class="view on" id="home">
    <div class="top">
      <button class="icon-btn" data-go="journey" aria-label="Journey"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <span class="chips"><span class="chip" title="Day streak">🔥 <span class="streakN"></span></span><span class="chip" title="Bugs fixed, all time">⚔️ <span class="totalN"></span></span></span>
    </div>
    <div class="brand">
      <div class="mark">&lt;/&gt;</div>
      <h1>Code Bug Drills</h1>
      <p>Find · Fix · Level up</p>
    </div>
    <button class="go" data-go="play"><b>Continue</b><span id="goSub">Today: 3 bugs</span></button>
  </section>

  <!-- journey: one streak number, this month, and the next goal -->
  <section class="view" id="journey">
    <div class="top">
      <button class="icon-btn" data-go="home" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    </div>
    <div class="j-head">
      <h2>Journey</h2>
      <div class="stats">
        <div><span class="ico">🔥</span><b class="streakN"></b><small>day streak</small></div>
        <div><span class="ico">⚔️</span><b class="totalN"></b><small>bugs fixed</small></div>
      </div>
    </div>
    <div class="card">
      <h3><span id="month">This month</span><small id="count"></small></h3>
      <div class="wk" id="cal"></div>
      <p class="key"><span><i style="background:#2f86ff"></i>1 set</span><span><i style="background:#bfe6ff;box-shadow:0 0 6px #7fc3ff"></i>2 or more</span></p>
      <p class="next" id="nextLine" style="margin-top:12px"></p>
    </div>
    <button class="go" data-go="play" style="margin-top:auto"><b>Play</b></button>
  </section>

  <!-- a drill: tap the line with the bug, then type the fix -->
  <section class="view" id="play">
    <div class="bar">
      <button class="icon-btn" data-go="home" aria-label="Quit"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="dots" id="dots"></div>
    </div>
    <h2 class="ask" id="ask"></h2>
    <div class="code" id="code"></div>
    <div class="fix" id="fix"><input id="fixIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the fixed line"></div>
    <p class="say" id="say"></p>
    <button class="go plain" id="act" style="display:none"><b>Check</b></button>
  </section>

  <!-- the end of the day's set -->
  <section class="view" id="end">
    <div class="win">
      <div class="big" id="score"></div>
      <p>bugs fixed</p>
      <div class="gain"><span class="ico">⚔️</span><b id="gainN"></b></div>
      <p class="next" id="endLine" style="margin-top:18px"></p>
    </div>
    <button class="go plain" data-go="home" style="margin-top:auto"><b>Done</b></button>
  </section>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var app = $("#app");
  var streak = 12;

  // three demo drills, taken from mistakes in the practice log
  var D = [
    { ask: "One smash uses two stones. Which line is wrong?",
      code: ["import heapq", "", "def lastStoneWeight(stones):", "    heap = [-s for s in stones]", "    heapq.heapify(heap)", "    while len(heap) > 1:", "        first = -heapq.heappop(heap)", "        second = -heap[0]", "        if first != second:", "            rest = first - second", "            heapq.heappush(heap, -rest)","    return -heap[0] if heap else 0"],
      bug: 7, fix: ["second = -heapq.heappop(heap)"],
      why: "A peek leaves the stone in the heap, so the heap never shrinks. Pop the second stone too." },
    { ask: "The code should work for any k. Which line is wrong?",
      code: ["import heapq", "", "def findKthLargest(nums, k):", "    heap = []", "    for num in nums:", "        heapq.heappush(heap, num)", "        if len(heap) > 3:", "            heapq.heappop(heap)", "    return heap[0]"],
      bug: 6, fix: ["if len(heap) > k:"],
      why: "The 3 came from the example. Compare with k, so the code works for every k." },
    { ask: "This crashes on the first push. Which line is wrong?",
      code: ["import heapq", "", "def kClosest(points, k):", "    heap = []", "    for x, y in points:", "        dist = x * x + y * y", "        heapq.heappush((-dist, x, y))", "        if len(heap) > k:", "            heapq.heappop(heap)", "    closest = []", "    for _, x, y in heap:", "        closest.append([x, y])", "    return closest"],
      bug: 6, fix: ["heapq.heappush(heap, (-dist, x, y))"],
      why: "heappush needs two things, the heap first and then the item." }
  ];

  // VS Code Dark+ colors
  var KW = /^(import|def|for|in|if|else|while|return|and|or|not|from)$/, BI = /^(len|range|max|min)$/;
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function hl(line) {
    return line.replace(/(#.*$)|('[^']*'|"[^"]*")|(\b\d+\b)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|([^\w\s]+)/g, function (m, c, s, n, call, id, op) {
      if (c) return '<span class="c">' + esc(c) + "</span>";
      if (s) return '<span class="s">' + esc(s) + "</span>";
      if (n) return '<span class="n">' + n + "</span>";
      if (call) return '<span class="' + (BI.test(call) ? "b" : "f") + '">' + call + "</span>";
      if (id) return KW.test(id) ? '<span class="k">' + id + "</span>" : id === "heapq" ? '<span class="b">' + id + "</span>" : '<span class="v">' + id + "</span>";
      return esc(op);
    });
  }

  // a 4-space indent shows as 2 characters, so lines fit a phone
  function ind(l) { return (l.length - l.trimStart().length) / 2; }
  // a long line may break only after a comma or "(", never in the middle of "second - first"
  function tidy(l) {
    // each piece between break points stays whole, so "-rest" or "second - first" never splits
    return l.split(/(?<=, |\()/).map(function (part) { return '<span class="nb">' + hl(part) + "</span>"; }).join("<wbr>");
  }

  function show(id) {
    document.querySelectorAll(".view").forEach(function (v) { v.classList.toggle("on", v.id === id); });
    app.classList.toggle("dim", id === "play");
    app.classList.toggle("soft", id === "journey");
    if (id === "play") start();
  }
  document.querySelectorAll("[data-go]").forEach(function (b) { b.addEventListener("click", function () { show(b.dataset.go); }); });

  // demo numbers. sets[d] is how many sets were done on day d this month
  var total = 248, setsToday = 0;
  var sets = {};
  (function () {
    var t = new Date().getDate();
    for (var k = 1; k < streak + 1; k++) if (t - k > 0) sets[t - k] = (k % 4 === 1 || k % 5 === 0) ? 2 : 1;
  })();

  // this month's calendar: one set lights a day blue, extra sets make it glow brighter, today has a gold ring
  function drawCal() {
    var now = new Date(), y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
    var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    var html = "SMTWTFS".split("").map(function (d) { return "<i>" + d + "</i>"; }).join("");
    for (var b = 0; b < first; b++) html += '<em class="blank"></em>';
    var done = 0;
    for (var d = 1; d <= days; d++) {
      var n = d === today ? setsToday : sets[d] || 0;
      var cls = (n >= 2 ? "more" : n === 1 ? "done" : "") + (d === today ? " today" : "");
      if (n) done++;
      html += '<em class="' + cls + '"></em>';
    }
    $("#cal").innerHTML = html;
    $("#month").textContent = now.toLocaleString("en", { month: "long" });
    $("#count").textContent = done + " days";
  }
  function paint() {
    document.querySelectorAll(".streakN").forEach(function (e) { e.textContent = streak; });
    document.querySelectorAll(".totalN").forEach(function (e) { e.textContent = total; });
    $("#goSub").textContent = setsToday ? "Extra round: 3 more bugs" : "Today: 3 bugs";
    $("#nextLine").innerHTML = setsToday ? "Done for today. An extra round makes today glow brighter." : "Play today to reach <b>" + (streak + 1) + " days</b>.";
    drawCal();
  }

  var at = 0, wins = 0, phase = "find";
  function start() { at = 0; wins = 0; load(); }
  function load() {
    var d = D[at]; phase = "find";
    $("#dots").innerHTML = D.map(function (_, i) { return '<i class="' + (i < at ? "done" : i === at ? "cur" : "") + '"></i>'; }).join("");
    $("#ask").textContent = d.ask;
    $("#code").innerHTML = d.code.map(function (l, i) { return '<div data-i="' + i + '"><u>' + (i + 1) + '</u><span class="t" style="padding-left:' + (ind(l) + 2) + 'ch;text-indent:-2ch">' + (tidy(l.trimStart()) || " ") + "</span></div>"; }).join("");
    $("#fix").classList.remove("on"); $("#fixIn").value = "";
    $("#say").textContent = "Tap the line."; $("#say").className = "say";
    $("#act").style.display = "none";
  }
  $("#code").addEventListener("click", function (e) {
    var row = e.target.closest("div[data-i]"); if (!row || phase !== "find") return;
    var d = D[at];
    if (+row.dataset.i !== d.bug) {
      row.classList.remove("bad"); void row.offsetWidth; row.classList.add("bad");
      $("#say").textContent = "Not that one. Try again."; $("#say").className = "say bad"; return;
    }
    row.classList.add("hit"); phase = "fix";
    $("#say").textContent = "Found it. Now type the fixed line."; $("#say").className = "say ok";
    $("#fix").classList.add("on"); $("#fixIn").focus();
    $("#act").style.display = ""; $("#act").querySelector("b").textContent = "Check";
  });
  function norm(s) { return s.replace(/\s+/g, "").replace(/"/g, "'"); }
  function burst() {
    var r = $("#act").getBoundingClientRect(), a = app.getBoundingClientRect();
    for (var i = 0; i < 18; i++) {
      var p = document.createElement("i"); p.className = "spark";
      p.style.left = (r.left - a.left + r.width / 2) + "px"; p.style.top = (r.top - a.top) + "px";
      var t = Math.random() * Math.PI * 2, s = 50 + Math.random() * 70;
      p.style.setProperty("--x", Math.cos(t) * s + "px"); p.style.setProperty("--y", (Math.sin(t) * s - 40) + "px");
      app.appendChild(p); setTimeout(function (q) { q.remove(); }.bind(null, p), 1200);
    }
  }
  $("#act").addEventListener("click", function () {
    var d = D[at];
    if (phase === "fix") {
      var ok = d.fix.some(function (f) { return norm(f) === norm($("#fixIn").value); });
      if (!ok) { $("#say").textContent = "Not quite. Look at what the line should do."; $("#say").className = "say bad"; return; }
      wins++; phase = "done"; burst();
      $("#say").textContent = d.why; $("#say").className = "say ok";
      $("#act").querySelector("b").textContent = at < D.length - 1 ? "Next bug" : "Finish";
    } else if (phase === "done") {
      if (at < D.length - 1) { at++; load(); }
      else {
        var first = setsToday === 0;
